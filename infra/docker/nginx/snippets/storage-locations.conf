# Public object API only. Do not proxy the MinIO console port (9001).
location / {
  # nginx treats HEAD as part of GET for limit_except.
  limit_except GET PUT {
    deny all;
  }

  set $the_eye_minio_backend http://minio:9000;
  proxy_pass $the_eye_minio_backend;
  proxy_http_version 1.1;

  # SigV4 signs the public Host header. Preserve it exactly.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  proxy_request_buffering off;
  proxy_buffering off;
  proxy_connect_timeout 30s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
}

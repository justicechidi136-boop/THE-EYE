# Stable Compose service names — never use container IP addresses.
# Location snippets proxy via variables (see api/admin/livekit-locations.conf) so
# nginx re-resolves Docker DNS after upstream recreation. These upstream blocks
# remain for health/documentation and rate-limit zone compatibility.
upstream the_eye_api {
  zone the_eye_api 64k;
  server api:4000 resolve;
}

upstream the_eye_admin_web {
  zone the_eye_admin_web 64k;
  server admin-web:3000 resolve;
}

upstream the_eye_livekit {
  zone the_eye_livekit 64k;
  server livekit:7880 resolve;
}

upstream the_eye_minio {
  zone the_eye_minio 64k;
  server minio:9000 resolve;
}

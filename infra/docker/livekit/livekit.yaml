port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Required for mobile/WebRTC clients outside Docker: advertise VPS public IP (via STUN).
  # Optional override: set LIVEKIT_NODE_IP on the host (passed as NODE_IP to the container).
  use_external_ip: true
logging:
  level: info

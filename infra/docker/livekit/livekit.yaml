port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Required for mobile/WebRTC clients outside Docker: advertise VPS public IP (via STUN).
  # Optional override: set node_ip in this file to the VPS public IPv4 if STUN discovery fails.
  use_external_ip: true
logging:
  level: info

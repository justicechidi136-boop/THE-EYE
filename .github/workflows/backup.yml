name: Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      with_restore_drill:
        description: Run isolated restore drill after backup
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Backup PostgreSQL on deployment host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            /bin/bash -s <<'EOS'
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin staging
            git checkout staging
            git pull --ff-only origin staging
            echo "VPS HEAD: $(git rev-parse HEAD)"
            RESTORE_DRILL='${{ github.event_name == 'workflow_dispatch' && github.event.inputs.with_restore_drill || 'false' }}'
            bash scripts/run-staging-backup.sh "${{ secrets.DEPLOY_PATH }}" "$RESTORE_DRILL"
            EOS

      - name: Upload latest backup artifact (optional)
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: the-eye-db-backup
          path: backups/the_eye_latest.dump
          retention-days: 7

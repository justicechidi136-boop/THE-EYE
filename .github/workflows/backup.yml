name: Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      with_restore_drill:
        description: Run isolated restore drill after backup
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup PostgreSQL on deployment host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            COMPOSE_FILE="${COMPOSE_FILE:-${{ secrets.DEPLOY_PATH }}/infra/docker/docker-compose.yml}"
            ENV_FILE="${ENV_FILE:-${{ secrets.DEPLOY_PATH }}/.env}"
            BACKUP_DIR="${BACKUP_DIR:-${{ secrets.DEPLOY_PATH }}/backups}"
            BACKUP_ARGS=(
              --compose-file "$COMPOSE_FILE"
              --env-file "$ENV_FILE"
              --output-dir "$BACKUP_DIR"
              --environment staging
            )
            if [[ "${{ github.event.inputs.with_restore_drill || 'false' }}" == "true" ]]; then
              BACKUP_ARGS+=(--with-restore-drill)
            fi
            bash scripts/backup-the-eye.sh "${BACKUP_ARGS[@]}"
            ls -lh "$BACKUP_DIR"/the-eye-staging-latest.dump "$BACKUP_DIR"/the_eye_latest.dump

      - name: Upload latest backup artifact (optional)
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: the-eye-db-backup
          path: backups/the_eye_latest.dump
          retention-days: 7

# Manual deployment only — does NOT run on push.
# Job C (production-deploy): requires production-release-build success + explicit vars/secrets.
# Run validate-production.yml Job B before deploying to production.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: Docker image tag (THE_EYE_IMAGE_TAG; defaults to commit SHA when empty)
        required: false
      run_migrations:
        description: Run prisma migrate deploy
        required: true
        default: true
        type: boolean
      confirm_release_build_passed:
        description: Confirm validate-production Job B (release build) passed for this SHA
        required: true
        default: false
        type: boolean
      proof_only:
        description: Staging only — sync repo and run location persistence proof (skip image redeploy)
        required: false
        default: false
        type: boolean
      run_location_proof:
        description: Staging only — run SRB-039 location persistence proof after deploy
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  production-deploy-preflight:
    name: Production deploy preflight (Job C gate)
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fail closed — production deploy requirements
        env:
          MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON }}
          WATCH_GOOGLE_SERVICES_JSON: ${{ secrets.WATCH_GOOGLE_SERVICES_JSON }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          CONFIRM_RELEASE_BUILD_PASSED: ${{ github.event.inputs.confirm_release_build_passed && 'true' || 'false' }}
        run: node scripts/ci/production-readiness-report.mjs --mode deploy-gate

  staging-deploy-preflight:
    name: Staging deploy preflight
    if: github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require staging deploy environment
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          THE_EYE_APP_ENV: ${{ vars.THE_EYE_APP_ENV }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}
        run: node scripts/ci/validate-staging-deploy-gate.mjs

  build:
    needs: [production-deploy-preflight, staging-deploy-preflight]
    if: always() && (needs.production-deploy-preflight.result == 'success' || needs.staging-deploy-preflight.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ghcr_prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.repository_owner != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: github.event.inputs.proof_only != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.ghcr_prefix }}/api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ghcr_prefix }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate admin-web build args (no fallback)
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "GitHub environment '${{ github.event.inputs.environment }}' must define vars.NEXT_PUBLIC_API_BASE_URL"
            exit 1
          fi
          case "${{ github.event.inputs.environment }}" in
            staging)
              node scripts/ci/validate-staging-api-url.mjs "$NEXT_PUBLIC_API_BASE_URL"
              ;;
            production)
              node -e "
                import { validateProductionApiUrl, logDeployUrlValidationFailure } from './scripts/ci/deploy-api-url-validation.mjs';
                const result = validateProductionApiUrl(process.env.NEXT_PUBLIC_API_BASE_URL);
                if (!result.ok) {
                  logDeployUrlValidationFailure(result);
                  process.exit(1);
                }
              "
              ;;
          esac

      - name: Build and push admin-web image
        if: github.event.inputs.proof_only != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-web/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=${{ github.event.inputs.environment }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.ghcr_prefix }}/admin-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ghcr_prefix }}/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Require VPS deploy secrets (staging)
        if: github.event.inputs.environment == 'staging'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub staging environment secret ${name} is not configured (DEP-004)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_PATH in the staging environment before certifying VPS deployment."
            exit 1
          fi

      - name: Deploy staging over SSH
        if: github.event.inputs.environment == 'staging'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_ROOT='${{ secrets.DEPLOY_PATH }}'
            cd "$DEPLOY_ROOT"
            export THE_EYE_IMAGE_TAG=${{ steps.meta.outputs.tag }}
            export ADMIN_WEB_APP_ENV=staging
            export NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            export PROOF_ONLY=${{ github.event.inputs.proof_only }}
            export RUN_LOCATION_PROOF=${{ github.event.inputs.run_location_proof }}
            git fetch --tags origin
            git checkout -- infra/docker/livekit/livekit.yaml 2>/dev/null || true
            git checkout ${{ github.sha }}
            echo "VPS HEAD: $(git rev-parse HEAD)"
            bash scripts/deploy-staging-vps-ci.sh

  deploy:
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Deprecated deploy job
        run: echo "SSH deploy runs in build job for staging."

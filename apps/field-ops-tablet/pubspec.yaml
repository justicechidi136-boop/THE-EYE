name: the_eye_field_ops
description: THE EYE field operations tablet — device registration, officer auth, and patrol shell.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  the_eye_flutter_l10n:
    path: ../../packages/flutter_l10n
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  battery_plus: ^6.2.1
  cryptography: ^2.7.0
  uuid: ^4.5.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  path_provider: ^2.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/field_ops_logo.png
    - assets/branding/field_ops_logo_ui.png

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def stagingStorePath = System.getenv("THE_EYE_STAGING_KEYSTORE_PATH") ?:
        keystoreProperties.getProperty("stagingStoreFile")
def stagingStorePassword = System.getenv("THE_EYE_STAGING_KEYSTORE_PASSWORD") ?:
        keystoreProperties.getProperty("stagingStorePassword")
def stagingKeyAlias = System.getenv("THE_EYE_STAGING_KEY_ALIAS") ?:
        keystoreProperties.getProperty("stagingKeyAlias")
def stagingKeyPassword = System.getenv("THE_EYE_STAGING_KEY_PASSWORD") ?:
        keystoreProperties.getProperty("stagingKeyPassword")
def allowDebugStagingRelease =
        (System.getenv("THE_EYE_ALLOW_DEBUG_STAGING_RELEASE") ?: "false") == "true"

def hasStagingReleaseSigning =
        stagingStorePath &&
        stagingStorePassword &&
        stagingKeyAlias &&
        stagingKeyPassword

def validateStagingReleaseSigning = tasks.register("validateStagingReleaseSigning") {
    doLast {
        if (!hasStagingReleaseSigning && !allowDebugStagingRelease) {
            throw new GradleException(
                "Staging release signing is not configured. " +
                "Set THE_EYE_STAGING_KEYSTORE_PATH, THE_EYE_STAGING_KEYSTORE_PASSWORD, " +
                "THE_EYE_STAGING_KEY_ALIAS, and THE_EYE_STAGING_KEY_PASSWORD " +
                "(or android/key.properties staging* entries). " +
                "Emergency override only: THE_EYE_ALLOW_DEBUG_STAGING_RELEASE=true"
            )
        }
    }
}

android {
    namespace = "com.theeye.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.theeye.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        stagingRelease {
            if (hasStagingReleaseSigning) {
                storeFile file(stagingStorePath)
                storePassword stagingStorePassword
                keyAlias stagingKeyAlias
                keyPassword stagingKeyPassword
            }
        }
    }

    flavorDimensions += "environment"
    productFlavors {
        development {
            dimension = "environment"
            applicationIdSuffix = ".dev"
            resValue "string", "app_name", "THE EYE Dev"
            manifestPlaceholders += [deepLinkScheme: "theeye-dev"]
        }
        staging {
            dimension = "environment"
            applicationIdSuffix = ".staging"
            resValue "string", "app_name", "THE EYE Staging"
            manifestPlaceholders += [deepLinkScheme: "theeye-staging"]
        }
        production {
            dimension = "environment"
            resValue "string", "app_name", "THE EYE"
            manifestPlaceholders += [deepLinkScheme: "theeye"]
        }
    }

    buildTypes {
        release {
            // Per-flavor signing is applied via androidComponents below.
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def envFlavor = variant.productFlavors.find { it.first == "environment" }?.second

        if (envFlavor == "staging") {
            if (allowDebugStagingRelease) {
                variant.signingConfig?.setConfig(android.signingConfigs.debug)
                return
            }
            if (!hasStagingReleaseSigning) {
                return
            }
            variant.signingConfig?.setConfig(android.signingConfigs.stagingRelease)
            return
        }

        // development/production release — unchanged until dedicated release keys land.
        variant.signingConfig?.setConfig(android.signingConfigs.debug)
    }
}

tasks.configureEach { task ->
    def createsStagingReleaseArtifact =
            task.name == "preStagingReleaseBuild" ||
            task.name == "assembleStagingRelease" ||
            task.name.startsWith("packageStagingRelease") ||
            task.name == "bundleStagingRelease" ||
            task.name == "signStagingReleaseBundle"
    if (createsStagingReleaseArtifact) {
        task.dependsOn(validateStagingReleaseSigning)
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
}
